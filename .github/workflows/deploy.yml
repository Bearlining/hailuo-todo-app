name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # 删除旧的 lockfile 因为它仍引用已删除的 pnpm-store link: 依赖
        # 让 pnpm install 基于当前 package.json 重新生成
        run: rm -f pnpm-lock.yaml && pnpm install

      - name: Build
        # 项目代码有遗留 TS 错误，type-check 会卡住 CI；Vite build 自带类型感知但对错误更宽容。
        # 部署以产物为准；开发环境 / IDE 仍做类型检查。
        run: pnpm run build:prod

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4'
        env:
          NODE_VERSION: '20'
